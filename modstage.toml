# Production client and dedicated-server pairs for Konfig's remote editing test (`just remote-edit-pair <node>`).
# Konfig resolves from Maven local, so publish the node there first. Versions follow the shared catalogs.
# Servers listen on 25581 so they do not collide with other paired suites on the default port.

[project]
name = "konfig"

[repositories]
mavenLocal = "mavenLocal"
kaf = "https://maven.kaf.sh"
fabric = "https://maven.fabricmc.net"
terraformers = "https://maven.terraformersmc.com/releases"
forge = "https://maven.minecraftforge.net"
neoforged = "https://maven.neoforged.net/releases"

[[instance]]
name = "1.17.1-fabric"
minecraft = "1.17.1"
loader = "fabric"
loader_version = "0.19.3"
sides = ["client", "server"]
server_properties = { online-mode = "false", enforce-secure-profile = "false", white-list = "false", server-port = "25581" }
mods = [
  "maven:com.iamkaf.konfig:konfig-fabric:0.10.1+1.17.1",
  "modrinth:fabric-api:0.46.1+1.17",
  "maven:com.terraformersmc:modmenu:2.0.17",
  "maven:com.iamkaf.teakit:teakit-fabric:0.19.0+1.17.1",
  "maven:com.iamkaf.teakit:teakit-playerdriver-fabric:0.19.0+1.17.1",
]

[[instance]]
name = "1.17.1-forge"
minecraft = "1.17.1"
loader = "forge"
loader_version = "37.1.1"
sides = ["client", "server"]
server_properties = { online-mode = "false", enforce-secure-profile = "false", white-list = "false", server-port = "25581" }
mods = [
  "maven:com.iamkaf.konfig:konfig-forge:0.10.1+1.17.1",
  "maven:com.iamkaf.teakit:teakit-forge:0.19.0+1.17.1",
  "maven:com.iamkaf.teakit:teakit-playerdriver-forge:0.19.0+1.17.1",
]

